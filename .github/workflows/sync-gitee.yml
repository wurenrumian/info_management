name: sync-gitee

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

jobs:
  sync:
    name: sync-to-gitee
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_KEY }}

      - name: Trust Gitee host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.GITEE_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Push main to Gitee
        run: |
          git remote add gitee "${{ secrets.GITEE_REMOTE }}"
          git push --force-with-lease gitee HEAD:main
